name: Migrations

# Replaces the "Supabase Preview" check, which never worked: it fired
# only on migration changes and then either 404'd in four seconds
# ("Postgres config not found") or hung forever waiting on a branch
# action, because two stale dashboard integrations were pointed at this
# repo and neither could provision. It never applied a migration.
#
# Schema migrations now live in `prisma/migrations/` and are applied
# with `prisma migrate deploy` — see docs/prisma-migrations.md. The
# Supabase CLI is kept ONLY to boot a throwaway Postgres that already
# has the `auth`/`storage` schemas Supabase itself provides (our
# migrations reference `auth.users` and `storage.buckets`); it no
# longer applies any migration of ours. This job boots that clean
# database and replays every Prisma migration, in order, from nothing.
# It needs no secrets and no Supabase account — everything runs in
# containers on the runner.

on:
  pull_request:
    # `prisma/**` and `supabase/config.toml` rather than `supabase/**`,
    # since `supabase/migrations/` is no longer where schema changes
    # land — see prisma/migrations/. This workflow is listed so that
    # edits to the check are validated by the check.
    #
    # NOTE: if this is ever made a REQUIRED status check, drop these
    # filters. GitHub leaves a required check that never ran stuck as
    # "expected", which blocks every PR that doesn't touch SQL.
    paths:
      - 'prisma/**'
      - 'supabase/config.toml'
      - 'supabase/ci/**'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'prisma/**'
      - 'supabase/config.toml'
      - 'supabase/ci/**'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest
    env:
      # Local Supabase Postgres has no pooler, so both point at the
      # same direct connection — see docs/prisma-migrations.md for how
      # this differs against the hosted project.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned rather than `latest`: this check is infrastructure,
          # and a CLI release changing behaviour should be a deliberate
          # bump in a PR, not a Tuesday where main goes red.
          version: 2.113.0

      # `supabase/migrations/` is empty now (migrations moved to
      # prisma/migrations/), so this only provisions the base Postgres
      # instance plus the `auth`/`storage` schema fixtures — it applies
      # none of our schema.
      - name: Start a clean Postgres (auth/storage fixtures only)
        run: supabase db start

      # The guarantee that every migration replays, in order, against
      # nothing. It fails on the first statement Postgres rejects.
      - name: Replay every Prisma migration from scratch
        run: npx prisma migrate deploy

      # A migration can apply "successfully" and still do nothing —
      # every DDL statement here is IF NOT EXISTS-guarded, which turns a
      # typo'd object name into a silent no-op. Assert the outcome, not
      # just the absence of an error.
      - name: Verify the resulting schema
        run: supabase db query --local --file supabase/ci/verify-schema.sql


      # A migration can apply "successfully" and still do nothing —
      # every DDL statement here is IF NOT EXISTS-guarded, which turns a
      # typo'd object name into a silent no-op. Assert the outcome, not
      # just the absence of an error.
      - name: Verify the resulting schema
        run: supabase db query --local --file supabase/ci/verify-schema.sql
